#p-ov .kpi .ic,#p-ov .sp .ic{color:#fff;filter:drop-shadow(0 1px 1px rgba(0,0,0,.18))}
#p-ov .kpi:hover{border-color:color-mix(in srgb,var(--c) 62%,var(--line));box-shadow:0 15px 28px -18px var(--c);transform:translateY(-3px)}
#p-ov .card h2 .ic:hover,#p-ov .kpi .ib:hover,#p-ov .sp .ib:hover{transform:translateY(-2px) scale(1.04);filter:brightness(1.08) drop-shadow(0 7px 10px color-mix(in srgb,var(--c,#2563a5) 35%,transparent))}
#p-ov .grid.g2>.card:nth-child(1) h2 .ic{background:#2563a5!important}#p-ov .grid.g2>.card:nth-child(2) h2 .ic{background:#7c3aed!important}#p-ov .grid.g2>.card:nth-child(3) h2 .ic{background:#d97706!important}#p-ov .grid.g2>.card:nth-child(4) h2 .ic{background:#0f8a8a!important}#p-ov .grid.g2>.card:nth-child(5) h2 .ic{background:#b7791f!important}
@keyframes overviewIconFloat{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-2px) rotate(-2deg)}}
@keyframes overviewIconPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes overviewShine{0%,70%,100%{transform:translateX(-120%)}85%{transform:translateX(120%)}}
@keyframes fl{50%{transform:translateY(-10px) rotate(6deg)}}@keyframes tw{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.2)}}
@keyframes shine{to{transform:translateX(100%)}}@keyframes breathe{50%{transform:scale(1.18);opacity:.7}}@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sweep{to{transform:translateX(100%)}}@keyframes pulse{50%{transform:scale(1.12)}}@keyframes wig{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(9deg) scale(1.1)}}
@keyframes glow{50%{filter:drop-shadow(0 0 8px #f5c451)}}@keyframes nudge{50%{transform:translate(2px,-2px)}}@keyframes nudged{50%{transform:translate(2px,2px)}}
@keyframes rpl{0%{box-shadow:0 0 0 0 rgba(189,47,35,.45)}100%{box-shadow:0 0 0 12px rgba(189,47,35,0)}}@keyframes pop{40%{transform:scale(1.35) rotate(-8deg)}}@keyframes dlg{from{opacity:0;transform:translateY(16px) scale(.98)}}

header h1{font-size:clamp(19px,4.8vw,27px)}.deco{top:68px}
.brand{display:flex;align-items:center;gap:12px;padding-bottom:12px;margin-bottom:12px;border-bottom:1px solid rgba(255,255,255,.15)}
.logo{position:relative;width:54px;height:54px;border-radius:17px;flex:none;display:grid;place-items:center;background:linear-gradient(145deg,rgba(255,255,255,.26),rgba(255,255,255,.06));border:1px solid rgba(255,255,255,.3);box-shadow:0 10px 22px -10px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.4)}
.logo::after{content:"";position:absolute;inset:-5px;border-radius:21px;border:1.5px solid rgba(243,200,110,.55);animation:ringp 3.4s ease-in-out infinite}
.logo svg,.logo img{width:42px;height:42px;object-fit:contain;border-radius:12px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35))}
.bt{min-width:0;flex:1}.bt b{display:block;color:#fff;font:700 clamp(16px,4.6vw,22px)/1.2 Fraunces,Georgia,serif;letter-spacing:.005em;text-wrap:balance;text-shadow:0 2px 10px rgba(0,0,0,.25)}
.bt small{display:flex;align-items:center;gap:8px;margin-top:4px;color:#f3d489;font-size:12.5px;font-weight:600;letter-spacing:.04em}.bt small::before{content:"";width:20px;height:2px;border-radius:2px;background:linear-gradient(90deg,#f3c86e,rgba(243,200,110,0))}
.theme{position:relative;flex:none;width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.12);color:#fff;cursor:pointer;display:grid;place-items:center;overflow:hidden;transition:background .2s,transform .2s,box-shadow .2s}
.theme:hover{background:rgba(255,255,255,.22);box-shadow:0 0 0 4px rgba(243,200,110,.18)}.theme:active{transform:scale(.92)}.theme:focus-visible{outline:2px solid #f3c86e;outline-offset:3px}
.theme svg{position:absolute;width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;transition:transform .55s cubic-bezier(.2,.8,.2,1),opacity .3s}
.theme .moon{color:#e4ecff}.theme .sun{color:#ffd778;transform:rotate(-100deg) scale(.3);opacity:0}
[data-theme=dark] .theme .sun{transform:none;opacity:1}[data-theme=dark] .theme .moon{transform:rotate(100deg) scale(.3);opacity:0}
.trend .tl.avg{stroke:var(--tavg)}.trend .tl.pass{stroke:var(--tpass)}.trend .tp{fill:var(--card)}.trend .tp.avg{stroke:var(--tavg)}.trend .tp.pass{stroke:var(--tpass)}.trend .tg{stroke:var(--tgrid)}
.trend text.tt{font-weight:600}.trend text.tt.avg{fill:var(--tavg)}.trend text.tt.pass{fill:var(--tpass)}.lavg{--c:var(--tavg)}.lpass{--c:var(--tpass)}
html.theming *,html.theming *::before,html.theming *::after{transition:background-color .4s,color .4s,border-color .4s,fill .4s,stroke .4s,box-shadow .4s!important}
@keyframes ringp{50%{transform:scale(1.07);opacity:.45}}
@media(min-width:760px){.logo{width:62px;height:62px;border-radius:19px}.logo svg,.logo img{width:48px;height:48px}.deco{top:76px}}
html[data-theme=dark]{color-scheme:dark;--bg:#09131f;--card:#0f1f35;--card2:#182c49;--ink:#e8eef8;--mut:#9aabc3;--line:#21385a;--ok:#5be0a0;--okb:rgba(60,210,150,.15);--warn:#f4c261;--warnb:rgba(244,194,97,.15);--bad:#ff8f84;--badb:rgba(255,120,105,.15);--info:#82bcf7;--infob:rgba(95,165,245,.17);--neu:#a9b7cc;--neub:rgba(160,178,205,.14);--bad2:rgba(255,120,105,.07);--warn2:rgba(244,194,97,.07);--sk1:#14263f;--sk2:#1d3556;--tavg:#82bcf7;--tpass:#5be0a0;--tgrid:#21385a}
[data-theme=dark] body{background:radial-gradient(900px 420px at 100% -5%,rgba(201,151,58,.10),transparent 60%),radial-gradient(700px 420px at -10% 35%,rgba(42,122,160,.15),transparent 60%),var(--bg)}
[data-theme=dark] header{background:linear-gradient(120deg,#050d18,#0e2744 55%,#12506e)}
[data-theme=dark] .hero{border:1px solid rgba(255,255,255,.09)}
[data-theme=dark] .btn{background:linear-gradient(135deg,#e6b24f,#b98128);color:#1b1306}[data-theme=dark] .btn:hover{background:linear-gradient(135deg,#f0c062,#c58d30)}
[data-theme=dark] nav button[aria-selected=true]{color:#fff}[data-theme=dark] nav{box-shadow:0 -10px 30px -12px rgba(0,0,0,.6)}
[data-theme=dark] .card:hover{box-shadow:0 18px 32px -16px rgba(0,0,0,.75)}[data-theme=dark] .kpi:hover{box-shadow:0 12px 24px -14px rgba(0,0,0,.7)}
[data-theme=dark] :is(select,input,.kpi):hover{border-color:#3c5d8c}[data-theme=dark] dialog{box-shadow:0 24px 60px rgba(0,0,0,.75)}
[data-theme=dark] .cols i{box-shadow:0 6px 14px -8px var(--c)}[data-theme=dark] .m3{color:var(--ink)}[data-theme=dark] .x{color:var(--ink)}
@media(prefers-reduced-motion:reduce){*,::before,::after{animation:none!important;transition:none!important}}
</style>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const RAW=(document.body.dataset.api||'').trim();
/* API base: haddii template-ku uusan render-gareyn, ka qaado URL-ka bogga */
/* ---------- mode madow/iftiin ---------- */
function setTheme(t,save){const h=document.documentElement,b=$('#theme');h.dataset.theme=t;b.setAttribute('aria-pressed',String(t==='dark'));b.setAttribute('aria-label',t==='dark'?'Beddel mode iftiin':'Beddel mode madow');
 const m=document.querySelector('meta[name=theme-color]');if(m)m.content=t==='dark'?'#050d18':'#12294a';if(save){try{localStorage.setItem('ta-theme',t)}catch(e){}}}
$('#theme').addEventListener('click',()=>{const h=document.documentElement,t=h.dataset.theme==='dark'?'light':'dark';if(!matchMedia('(prefers-reduced-motion:reduce)').matches){h.classList.add('theming');setTimeout(()=>h.classList.remove('theming'),500)}setTheme(t,true)});
matchMedia('(prefers-color-scheme:dark)').addEventListener?.('change',e=>{try{if(localStorage.getItem('ta-theme'))return}catch(_){}setTheme(e.matches?'dark':'light',false)});
setTheme(document.documentElement.dataset.theme==='dark'?'dark':'light',false);
/* ---------- dugsiga: magac + logo (template: school_name, school_logo) ---------- */
const cv=(v,d)=>{v=(v||'').trim();return v&&!v.includes('{'+ '{')?v:d};
const SCHOOL=cv(document.body.dataset.school,'Taysiir International Schools'),LOGO=cv(document.body.dataset.logo,'');
(()=>{$('#sname').textContent=SCHOOL;document.title=SCHOOL+' — Fallanqeynta Natiijooyinka';const L=$('#logo'),crest=()=>{L.innerHTML='<svg viewBox="0 0 64 64" aria-hidden="true"><use href="#crest"/></svg>'};
 if(LOGO&&/^(https?:|\/|data:image\/)/i.test(LOGO)){const i=new Image();i.alt='Logo '+SCHOOL;i.onerror=crest;i.src=LOGO;L.replaceChildren(i)}else crest()})();
const API=(RAW&&!RAW.includes('{'+ '{')?RAW:location.pathname.replace(/\.html?$/,'')).replace(/\/+$/,'');
const SAMPLE_DEFAULT=false; /* true = xog sample ah (API la'aan). Marka API-ga dhabta ah la xiro, ka dhig false (ama ?sample=0) */
const QS=new URLSearchParams(location.search),SAMPLE=QS.get('sample')==='0'?false:(QS.get('sample')==='1'||SAMPLE_DEFAULT);

const ICON={book:'lucideBookOpen',school:'lucideSchool',alert:'lucideTriangleAlert',trophy:'lucideTrophy',up:'lucideTrendingUp',down:'lucideTrendingDown',star:'lucideAward',users:'lucideUsersRound',clock:'lucideClock3',chart:'lucideBarChart3',bulb:'lucideLightbulb',list:'lucideListChecks',check:'lucideCircleCheck',target:'lucideTarget',filter:'lucideFunnel',chev:'lucideChevronDown',refresh:'lucideRotateCcw',close:'lucideX'};
const UI=['chev','refresh','close'],IC=n=>`<svg class="${UI.includes(n)?'ui':'ic'}" aria-hidden="true"><use href="#${ICON[n]||n}"/></svg>`;
const ib=(n,t)=>`<span class="ib ${t} i-${n}">${IC(n)}</span>`;
const chip=(t,x,i)=>`<span class="chip ${t}">${i?IC(i):''}${x}</span>`;

const PR={high:['bad','Sare'],medium:['warn','Dhexe'],low:['info','Hoose']};
const RK={high:['bad','Khatar sare','alert'],medium:['warn','Khatar dhexe','alert'],none:['ok','Caadi','check']};
const RS={low_n:v=>`Dhibco hoose (${f1(v.n)} maado)`,low_score:v=>`Dhibco hoose${v.subject?': '+esc(v.subject):''} (${pc(v.pct)})`,missing:v=>`Maado maqan${v.subjects?': '+v.subjects.map(esc).join(', '):''}`,absent:v=>`Maqnaansho${v.subjects?': '+v.subjects.map(esc).join(', '):''}`,declined:v=>`Hoos-u-dhac ${f1(v.pts)} dhibcood`,incomplete:v=>`Natiijo aan dhammaystirnayn (${f1(v.n)})`,low_avg:v=>`Celcelis hoose (${pc(v.avg)})`,low_pass:v=>`Gudbitaan hoose (${pc(v.pass)})`,missing_many:v=>`Natiijooyin badan oo maqan (${pc(v.pct)})`};
const rsn=(a,compact)=>{if(compact&&a){const ls=a.filter(x=>x.code==='low_score');if(ls.length>1)a=[{code:'low_n',v:{n:ls.length}},...a.filter(x=>x.code!=='low_score')]}return rsn0(a)};
const rsn0=a=>(a&&a.length)?`<div class="rsw">${a.map(r=>`<span class="chip neu rs">${RS[r.code]?RS[r.code](r.v||{}):esc(r.code)}</span>`).join('')}</div>`:'';

/* ---------- API ---------- */
/* ===== SAMPLE ENGINE — xog sample ah oo si dhab ah u shaqeysa (API lama isticmaalo) =====
   Xog la abuuray (seeded = mar walba isku mid), kadibna la falanqeeyay sida backend-ka. */
const SC={pass_mark:50,grade_bands:[{grade:'A',min:80},{grade:'B',min:70},{grade:'C',min:60},{grade:'D',min:50},{grade:'E',min:0}],thresholds:{low_avg:55,low_pass:65,missing_pct:8,decline_pts:8,improve_pts:8,consistency_sd:8}};
const EXAMS=['Dhexe 1','Dhexe 2','Final'],YEARS=['2025/2026','2024/2025'];
const LV={'Secondary':{cls:['Form 4 A','Form 4 B','Form 3 A'],sub:['Xisaab','Fiisigis','Kimistari','Ingiriisi','Soomaali']},'Upper Primary':{cls:['Class 8 A','Class 7 A'],sub:['Xisaab','Sayniska','Ingiriisi','Soomaali']},'Lower Primary':{cls:['Class 4 A'],sub:['Xisaab','Ingiriisi','Soomaali']}};
const FNM=['Axmed','Maxamed','Cabdi','Siciid','Yaasiin','Cali','Ismaaciil','Bashiir','Cumar','Faarax','Mustafe','Ciise'],FNF=['Hodan','Faadumo','Maryan','Ilhaan','Sacdiyo','Nimco','Xaawo','Asha','Amina','Fartuun','Layla','Ubax'],LNM=['Cali','Nuur','Xasan','Warsame','Jaamac','Yuusuf','Aadan','Ibraahim','Dahir','Gaas','Maxamuud','Abshir','Cabdulle','Cismaan'];
function xrng(seed){let h=1779033703^seed.length;for(let i=0;i<seed.length;i++){h=Math.imul(h^seed.charCodeAt(i),3432918353);h=h<<13|h>>>19}let a=h>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const xgz=R=>Math.sqrt(-2*Math.log(R()||1e-9))*Math.cos(2*Math.PI*R()),xr1=x=>x==null?null:Math.round(x*10)/10,xmean=a=>a.reduce((p,q)=>p+q,0)/a.length,xavg=a=>a.length?xr1(xmean(a)):null;
const xmed=a=>{const s=[...a].sort((p,q)=>p-q),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2},xsd=a=>{if(a.length<2)return null;const m=xmean(a);return Math.sqrt(xmean(a.map(x=>(x-m)**2)))};
const xband=p=>(SC.grade_bands.find(b=>p>=b.min)||SC.grade_bands.at(-1)).grade,xby=(rs,k)=>{const m=new Map();rs.forEach(r=>{if(!m.has(r[k]))m.set(r[k],[]);m.get(r[k]).push(r)});return m},xuniq=a=>new Set(a).size;
function sampleFilters(){const o=[];YEARS.forEach(y=>[...EXAMS].reverse().forEach(e=>Object.entries(LV).forEach(([l,v])=>v.cls.forEach(c=>v.sub.forEach(s=>o.push({year:y,exam:e,level:l,cls:c,subject:s}))))));return o}

 <div class="card"><h2>${IC('up')}Kuwii horumariyey</h2><p class="sub">Vs ${esc(d.config.prev_exam||'imtixaankii hore')}</p>${lst(d.up)}</div>
 <div class="card"><h2>${IC('down')}Kuwii hoos u dhacay</h2><p class="sub">Vs ${esc(d.config.prev_exam||'imtixaankii hore')}</p>${lst(d.down)}</div></div>`}
function drawSupport(){const q=($('#q')?.value||'').toLowerCase(),pf=$('#pf')?.value;const a=D.support.filter(s=>s.name.toLowerCase().includes(q)&&(!pf||s.priority===pf));$('#sl').innerHTML=lst(a)}
const IN={weak_subject:['down','Maadada ugu daciifsan: '+'{name}',v=>`Celcelis ${pc(v.avg)} iyo gudbitaan ${pc(v.pass)} — ka hooseeya maadooyinka kale ee la falanqeeyey.`],best_subject:['star','Maadada ugu fiican: {name}',v=>`Celcelis ${pc(v.avg)}, kan ugu sarreeya maadooyinka.`],risky_class:['school','{name} waxay u baahan tahay indho gaar ah',v=>`Celcelis ${pc(v.avg)} iyo gudbitaan ${pc(v.pass)} — xadka khatarta waa laga hooseeyaa.`],support_students:['users','{n} arday ayaa u baahan taageero',v=>`${f1(v.high)} ka mid ah ayaa priority sare leh (dhibco hoose, hoos-u-dhac ama natiijo maqan).`],missing_results:['clock','{n} natiijo ayaa weli maqan',v=>`Waa ${pc(v.pct)} natiijooyinka la filayay; falanqeyntu way ka yaraan kartaa xaqiiqada ilaa la geliyo.`],improving:['up','{n} arday ayaa horumar sameeyay',v=>`Kan ugu horumarka badan wuxuu kordhiyay ${f1(v.pts)} dhibcood imtixaankii hore.`],declining:['down','{n} arday ayaa hoos u dhacay',v=>`Kan ugu badan wuxuu ku dhacay ${f1(v.pts)} dhibcood imtixaankii hore.`]};
const TN={good:'ok',warn:'warn',bad:'bad',info:'info'},IM={high:['Muhiimad sare',0],medium:['Muhiimad dhexe',1],low:['Muhiimad hoose',2]};
function inn(d){const a=[...d.insights].sort((x,y)=>(IM[x.importance]||[0,3])[1]-(IM[y.importance]||[0,3])[1]);
 if(!a.length)return `<div class="card state" style="margin-top:12px">${ib('bulb','neu')}<p>Xog ku filan oo fikrado laga soo saaro ma jirto.</p></div>`;
 return `<div class="grid">${a.map((x,i)=>{const m=IN[x.code];if(!m)return'';const t=TN[x.tone]||'info',v=x.v||{};const ttl=m[1].replace(/\{(\w+)\}/g,(_,k)=>esc(v[k]));
 return `<div class="ins ${t}" style="animation-delay:${i*60}ms">${ib(m[0],t)}<div class="t"><b>${ttl}</b><p>${m[2](v)}</p>${chip(t,(IM[x.importance]||IM.low)[0])}</div></div>`}).join('')}</div>`}

function openStu(id){const s=S[id];if(!s)return;const p=PR[s.priority],R=s.results||[];
 const cell=r=>r.status==='absent'?chip('info','Maqnaansho','userx'):r.status==='missing'?chip('warn','Maan-gelin','clock'):r.pct===0?chip('neu','Eber','zero'):`<b>${pc(r.pct)}</b> ${chip(ptone(r.pct),esc(r.grade||''))}`;
 $('#dc').innerHTML=`<div class="ih"><span class="av ${p?p[0]:'info'}">${esc(ini(s.name))}</span><div class="t"><b id="dn" style="font-size:17px">${esc(s.name)}</b><small>${esc(s.cls)} · celcelis ${pc(s.avg)}${s.delta!=null?` · ${s.delta>=0?'▲ +':'▼ '}${f1(s.delta)}`:''}</small></div><button class="x" id="cl" aria-label="Xir">${IC('close')}</button></div>
 <div class="rsw">${p?chip(p[0],'Priority: '+p[1]):''}${(s.badges||[]).map(b=>BD[b]?chip(BD[b][0],BD[b][1],BD[b][2]):'').join('')}</div>${s.reasons&&s.reasons.length?`<p class="sub" style="margin:12px 0 0">Sababta loo calaamadeeyey</p>${rsn(s.reasons)}`:''}
 <p class="sub" style="margin:14px 0 0">Natiijooyinka Maaddo walba</p>${R.length?`<table><thead><tr><th>Maado</th><th>Natiijo</th><th>Xaalad</th></tr></thead><tbody>${R.map(r=>`<tr><td>${esc(r.subject)}</td><td>${cell(r)}</td><td>${r.state?esc(STATE[r.state]||r.state):'—'}</td></tr>`).join('')}</tbody></table>`:'<p class="sub">Faahfaahin lama helin.</p>'}`;
 $('#dlg').showModal();$('#cl').addEventListener('click',()=>$('#dlg').close())}

const stag=()=>$$('.pane').forEach(p=>[...p.querySelectorAll('.card,.kpi,.item')].forEach((c,i)=>c.style.setProperty('--i',Math.min(i,10))));
function count(){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;$$('[data-to]').forEach(el=>{const to=+el.dataset.to,s=el.dataset.s||'',fin=el.textContent,dec=el.dataset.to.includes('.')?1:0,t0=performance.now(),f=t=>{const p=Math.min((t-t0)/1100,1);el.textContent=p<1?(to*(1-Math.pow(1-p,3))).toFixed(dec)+s:fin;if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)})}
function render(d){D=d;if(d.empty){setState('empty');return}
 S={};[...d.support,...d.top,...d.up,...d.down].forEach(s=>{const o=S[s.id]||{},m={...o,...s};['results','reasons','badges'].forEach(k=>{m[k]=(s[k]&&s[k].length?s[k]:o[k])||[]});if(o.priority&&!s.priority)m.priority=o.priority;S[s.id]=m});
 $('#p-ov').innerHTML=ov(d);$('#p-sb').innerHTML=sb(d);$('#p-st').innerHTML=st(d);$('#p-in').innerHTML=inn(d);
 setState('ok');stag();count();if(matchMedia('(max-width:759px)').matches)$('details.f').open=false;drawSupport();$('#q').addEventListener('input',drawSupport);$('#pf').addEventListener('change',drawSupport);
 requestAnimationFrame(()=>$$('.fg2').forEach(c=>c.style.strokeDashoffset=314.2*(1-(+c.dataset.v||0)/100)))}
async function load(){const b=$('#go');b.disabled=true;setState('load');
 try{render(await api('/data?'+new URLSearchParams(KEYS.map(k=>[k,$(`#${k}`).value]))))}catch(e){setState('err',{msg:e.message,k:e.k})}b.disabled=false}
$('#go').addEventListener('click',load);
document.addEventListener('click',e=>{const r=e.target.closest('[data-sid]');if(r)openStu(r.dataset.sid)});
$('#dlg').addEventListener('click',e=>{if(e.target===$('#dlg'))$('#dlg').close()});
$$('#nav button').forEach(b=>b.addEventListener('click',()=>{$$('#nav button').forEach(x=>x.setAttribute('aria-selected',x===b));$$('.pane').forEach(p=>p.classList.toggle('on',p.id==='p-'+b.dataset.t));scrollTo({top:0,behavior:'smooth'})}));
(async()=>{if(SAMPLE)$('#dev').hidden=false;setState('load');
 try{A=await api('/filters');if(!Array.isArray(A)||!A.length){setState('empty');return}}
 catch(e){setState('err',{msg:e.message,k:e.k});return}
 /* Select the first valid real scope so the page is useful immediately. */
 fill(0);
 KEYS.forEach((k,i)=>{
  const el=$('#'+k),wanted=QS.get(k),values=[...el.options].map(o=>o.value);
  if(wanted&&values.includes(wanted))el.value=wanted;
  else if(!el.value&&i<3)el.value=values[0]||'';
  if(i<KEYS.length-1)fill(i+1);
 });
 load()})();
</script>
</body>
</html>
