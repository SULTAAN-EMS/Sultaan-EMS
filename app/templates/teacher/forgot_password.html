{% extends "base.html" %}
{% block body_class %}login-body{% endblock %}
{% block content %}
<main class="login-page">
  <form method="post" class="login-card glass-card">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="login-mark"><i class="fa-solid fa-key"></i></div>
    <span class="eyebrow"><i class="fa-solid fa-unlock-keyhole"></i> BEDDELID PASSWORD</span>
    <h1>Waaxda Macallinka</h1>
    <p>Geli af-garashadaada iyo tira-taxanahaaga. Codsiga waxaa eegi doona xafiiska imtixaannada dugsiga</p>
    <label><i class="fa-solid fa-user"></i> Magaca gelitaanka<input name="username" autocomplete="username" required autofocus></label>
    <label><i class="fa-solid fa-id-card"></i> Aqoonsiga macallinka<input name="teacher_id" autocomplete="off" required></label>
    <button type="submit" class="premium"><i class="fa-solid fa-paper-plane"></i> Codso beddelid</button>
    <p style="margin:0;text-align:center;"><a href="{{ url_for('teacher_portal.login') }}">Dib-u-noqo</a></p>
  </form>
</main>
{% endblock %}
