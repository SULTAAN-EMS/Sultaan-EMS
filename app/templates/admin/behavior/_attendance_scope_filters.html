<form class="attendance-scope-filters" method="get" action="{{ url_for('behavior.attendance') }}">
  <input type="hidden" name="attendance_view" value="{{ attendance_view_target }}">
  <div class="behavior-field"><label>Academic Year</label><select name="year_id"><option value="">Select year</option>{% for year in years %}<option value="{{ year.id }}" {% if selected_year and year.id == selected_year.id %}selected{% endif %}>{{ year.name }}</option>{% endfor %}</select></div>
  <div class="behavior-field"><label>Academic Level</label><select name="level_id"><option value="">Select level</option>{% for item in levels %}<option value="{{ item.id }}" {% if selected_level and item.id == selected_level.id %}selected{% endif %}>{{ item.name }}</option>{% endfor %}</select></div>
  <div class="behavior-field"><label>Class</label><select name="class_id"><option value="">All classes</option>{% for item in classes %}<option value="{{ item.id }}" {% if selected_class and item.id == selected_class.id %}selected{% endif %}>{{ item.name }}</option>{% endfor %}</select></div>
  <div class="behavior-field"><label>Behavior Configuration</label><select name="config_id"><option value="">Select configuration</option>{% for item in configurations %}<option value="{{ item.id }}" {% if config and item.id == config.id %}selected{% endif %}>{{ item.academic_year_level.name }} &bull; {{ item.behavior_subject.name }}</option>{% endfor %}</select></div>
  <div class="behavior-field"><label>Session / Exam Type</label><select name="session_id"><option value="">Select session</option>{% for item in sessions %}<option value="{{ item.id }}" {% if selected_session and item.id == selected_session.id %}selected{% endif %}>{{ item.session_label }} &bull; {{ item.maximum_score }}</option>{% endfor %}</select></div>
  <div class="behavior-field"><label>Date + Time</label><div class="attendance-date-time"><input type="date" name="attendance_date" value="{{ attendance_date.isoformat() }}"><input type="time" name="attendance_time" value="{{ attendance_time.strftime('%H:%M') }}" aria-label="Attendance time"></div></div>
  <div class="attendance-scope-filters__actions"><button class="behavior-btn behavior-btn--primary behavior-btn--small" type="submit"><i class="fa-solid fa-filter"></i> Apply filters</button></div>
</form>
