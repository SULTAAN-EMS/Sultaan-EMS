{% extends "admin/base.html" %}

{% block title %}{{ 'Edit' if hall.id else 'Add' }} Exam Hall{% endblock %}

{% block admin_content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1>{{ 'Edit' if hall.id else 'Add' }} Exam Hall</h1>
    <a href="{{ url_for('seat_arrangement.hall_list') }}" class="btn btn-outline-secondary">
        ← Back to Halls
    </a>
</div>

<div class="card">
    <div class="card-body">
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="row">
                <div class="col-md-6">
                    <div class="mb-3">
                        <label for="name" class="form-label">Hall Name *</label>
                        <input type="text" class="form-control" id="name" name="name" value="{{ hall.name or '' }}" required>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="mb-3">
                        <label for="code" class="form-label">Hall Code *</label>
                        <input type="text" class="form-control" id="code" name="code" value="{{ hall.code or '' }}" required>
                        <small class="text-muted">Unique identifier (e.g., HALL-A, MAIN-BLOCK)</small>
                    </div>
                </div>
            </div>
            
            <div class="mb-3">
                <label for="description" class="form-label">Description</label>
                <textarea class="form-control" id="description" name="description" rows="2">{{ hall.description or '' }}</textarea>
            </div>
            
            <div class="row">
                <div class="col-md-4">
                    <div class="mb-3">
                        <label for="capacity" class="form-label">Capacity</label>
                        <input type="number" class="form-control" id="capacity" name="capacity" value="{{ hall.capacity or 0 }}" min="0">
                        <small class="text-muted">Maximum number of students</small>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="mb-3">
                        <label for="sort_order" class="form-label">Sort Order</label>
                        <input type="number" class="form-control" id="sort_order" name="sort_order" value="{{ hall.sort_order or 0 }}" min="0">
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="mb-3">
                        <div class="form-check mt-4">
                            <input class="form-check-input" type="checkbox" id="is_active" name="is_active" {% if hall.is_active or not hall.id %}checked{% endif %}>
                            <label class="form-check-label" for="is_active">Active</label>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="mt-4">
                <button type="submit" class="btn btn-primary">
                    {{ 'Update' if hall.id else 'Create' }} Hall
                </button>
                <a href="{{ url_for('seat_arrangement.hall_list') }}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
