<!doctype html>
<html lang="so">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>{{ error_title }} · SULTAAN EMS</title>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    :root{color-scheme:light dark;font-family:Inter,"Segoe UI",Arial,sans-serif;font-synthesis:none;text-rendering:optimizeLegibility}
    *{box-sizing:border-box}
    body{display:grid;min-height:100vh;min-height:100dvh;margin:0;padding:24px;place-items:center;color:#14231d;background:radial-gradient(ellipse at 50% -18%,#e8f4ef 0,transparent 56%),#f3f6f4}
    .error-card{position:relative;width:min(100%,560px);overflow:hidden;padding:clamp(24px,5vw,40px);border:1px solid #dce7e0;border-radius:18px;background:#fff;box-shadow:0 26px 80px rgba(18,47,34,.14);animation:error-card-enter .42s cubic-bezier(.2,.8,.2,1) both}
    .error-card:before{position:absolute;inset:0 0 auto;height:5px;background:linear-gradient(90deg,#bf3838,#e78c5e,#d9aa42);content:""}
    .error-icon{display:grid;width:58px;height:58px;margin-bottom:22px;place-items:center;border:1px solid #f1c6c2;border-radius:16px;color:#b93632;background:#fff0ee;font-size:25px;animation:error-icon-enter .52s .08s cubic-bezier(.2,1.35,.35,1) both}
    .eyebrow{margin:0 0 8px;color:#9b4942;font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase}
    h1{margin:0;color:#17251e;font-size:clamp(24px,5vw,31px);line-height:1.18}
    .message{margin:14px 0 0;color:#52655b;font-size:15px;line-height:1.65}
    .reason{display:flex;gap:11px;margin-top:22px;padding:13px 14px;border:1px solid #f0d8a7;border-left:4px solid #c58b20;border-radius:10px;color:#624c20;background:#fff9eb;font-size:13px;line-height:1.5}
    .reason i{flex:0 0 auto;margin-top:2px;color:#a97515}
    .reference{margin:18px 0 0;color:#718078;font-size:12px}
    .reference code{padding:3px 6px;border:1px solid #e0e7e2;border-radius:5px;color:#33483c;background:#f7faf8;font:700 11px ui-monospace,Consolas,monospace}
    .actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:25px}
    .actions a,.actions button{display:inline-flex;min-height:42px;align-items:center;justify-content:center;gap:8px;padding:9px 14px;border:1px solid #d5e1da;border-radius:8px;color:#294237;background:#fff;font:700 13px/1.2 Inter,"Segoe UI",Arial,sans-serif;text-decoration:none;cursor:pointer;transition:transform .18s ease,border-color .18s ease,background .18s ease}
    .actions .primary{border-color:#176b50;color:#fff;background:#176b50}
    .actions a:hover,.actions button:hover{transform:translateY(-1px);border-color:#80a895}
    .actions .primary:hover{border-color:#0c543b;background:#0c543b}
    @keyframes error-card-enter{from{opacity:0;transform:translateY(12px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
    @keyframes error-icon-enter{from{opacity:0;transform:scale(.7) rotate(-8deg)}to{opacity:1;transform:scale(1) rotate(0)}}
    @media(prefers-color-scheme:dark){body{color:#e8f1ec;background:radial-gradient(ellipse at 50% -18%,#203a2e 0,transparent 58%),#0c1511}.error-card{border-color:#2c4438;background:#14211a;box-shadow:0 26px 80px rgba(0,0,0,.34)}h1{color:#edf5ef}.message{color:#b4c7bb}.error-icon{border-color:#663a37;color:#ffaaa2;background:#35201f}.eyebrow{color:#f2a29a}.reason{border-color:#5c4b29;border-left-color:#d9ab48;color:#f0dda9;background:#2b261b}.reason i{color:#e0b752}.reference{color:#9eafa4}.reference code{border-color:#35473b;color:#d6e5db;background:#1a2a20}.actions a,.actions button{border-color:#3a5043;color:#d9e8de;background:#18281f}.actions .primary{border-color:#247c5d;color:white;background:#247c5d}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <main class="error-card" role="alert">
    <div class="error-icon" aria-hidden="true"><i class="fa-solid fa-circle-exclamation"></i></div>
    <p class="eyebrow">Codsiga lama dhammaystirin</p>
    <h1>{{ error_title }}</h1>
    <p class="message">{{ error_message }}</p>
    <div class="reason"><i class="fa-solid fa-circle-info" aria-hidden="true"></i><span>Fariintani waxay tilmaamaysaa waxa xiga ee la sameeyo; faahfaahinta farsamada waxaa lagu kaydiyey log-ga server-ka.</span></div>
    <p class="reference">Lambarka tixraaca: <code>{{ error_reference }}</code></p>
    <div class="actions">
      <a class="primary" href="{{ request_path }}"><i class="fa-solid fa-rotate-right" aria-hidden="true"></i> Mar kale isku day</a>
      <button type="button" onclick="history.back()"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Dib u noqo</button>
    </div>
  </main>
</body>
</html>
